[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-system-task-manager"
version = "0.4.2"
description = "A native task and performance manager for Ubuntu and Debian"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Linux Task Manager contributors"}]
keywords = ["linux", "task-manager", "process-monitor", "gtk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/narguis/linux-task-manager"

[project.scripts]
linux-task-manager = "linux_task_manager.app:main"

[tool.setuptools]
packages = ["linux_task_manager"]
include-package-data = true

[tool.setuptools.package-data]
linux_task_manager = ["resources/*.css", "resources/*.svg", "resources/*.txt"]
